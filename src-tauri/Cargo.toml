[package]
name = "loot-table"
version = "0.1.1"
description = "Find your next LitRPG audiobook"
authors = ["Loot Table"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "loot_table_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-opener = "2"
